[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox_escape_finder"
version = "0.1.0"
description = "Static + dynamic escape-technique finder for evaluating the robustness of Python execution sandboxes (defensive security research)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "RA Applicant" }]
keywords = ["security", "sandbox", "program-analysis", "ast", "restrictedpython"]

# Pinned dependencies (exact) for reproducible results. RestrictedPython is the
# target sandbox under test — pinning it means a future release cannot silently
# change the dynamic results reported in the README.
dependencies = [
    "RestrictedPython==8.5",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
